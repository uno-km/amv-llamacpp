[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amv-llamacpp"
version = "1.5.0"
description = "GGUF runtime, model manager & OpenAI server utilizing device resources for Android Termux & ARM64"
readme = "README.md"
authors = [{ name = "uno-km", email = "dev@ameva.org" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Android",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
keywords = [
    "termux",
    "llama.cpp",
    "gguf",
    "android",
    "llm",
    "arm64",
    "openai-server",
    "on-device-ai",
    "edge-ai",
    "mobile-ai",
    "vulkan",
    "vulkan-compute",
    "gpu-acceleration",
    "local-ai",
    "snapdragon",
    "adreno",
    "arm-mali",
    "exynos",
    "zero-compilation",
    "supply-chain-security",
    "ed25519-verification",
    "server-sent-events",
    "streaming-inference",
    "chat-completions",
    "rest-api",
    "function-calling",
    "tool-calling",
    "vision-llm",
    "multimodal-ai",
    "mmproj",
    "qwen2.5",
    "llama3",
    "gemma2",
    "deepseek",
    "mistral",
    "phi3",
    "huggingface",
    "model-manager",
    "reverse-proxy",
    "daemon-supervisor",
    "termux-aichain",
    "termux-tts",
    "termux-stt",
    "termux-diffusion",
    "ameva-runtime",
    "quantization-q4",
    "bionic-libc",
    "mmap-inference",
    "autonomous-agents",
    "ai-orchestrator"
]
requires-python = ">=3.8"
dependencies = ["requests>=2.31.0", "tqdm>=4.66.0", "ameva-device-sdk @ https://github.com/uno-km/ameva-device-sdk/releases/download/v0.2.0/ameva_device_sdk-0.2.0-py3-none-any.whl#sha256=81e555feb798a1d84c5e605c831d80a33ecb579d32e14a74ca4674ad9ab03085", "ameva-component-sdk @ https://github.com/uno-km/ameva-component-sdk/releases/download/v0.1.2/ameva_component_sdk-0.1.2-py3-none-any.whl#sha256=6d02eaf3cbd0be9ed02ab24f279eb3736da8c3a1c28762e3411ee428931549c6"]

[project.optional-dependencies]
gpu = [
    "ameva-runtime>=2.0.0",
]
vulkan = [
    "ameva-runtime>=2.0.0",
]
security = [
    "cryptography>=42.0.0",
]
crawler = [
    "termux-playwright>=1.70.0",
]
test = [
    "pytest>=7.0.0",
]

[project.scripts]
termux-llama = "termux_llamacpp.cli:main"
termux-llamacpp = "termux_llamacpp.cli:main"

[project.entry-points."ameva.components"]
termux-llamacpp = "termux_llamacpp.adapter:create_adapter"

[project.urls]
Homepage = "https://uno-km.github.io/termux-llamacpp"
Repository = "https://github.com/uno-km/termux-llamacpp"
Documentation = "https://uno-km.github.io/termux-llamacpp"

[tool.setuptools.packages.find]
include = ["termux_llamacpp", "termux_llamacpp.*"]

[tool.setuptools.package-data]
termux_llamacpp = [
    "scripts/*.sh",
    "registry/*.json",
    "trust/*.pub",
    "trust/*.json",
]
